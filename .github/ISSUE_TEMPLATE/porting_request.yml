name: Port from machine
description: Track relevant behavior to port from sillsdev/machine
title: "Port: "
labels:
  - porting
body:
  - type: markdown
    attributes:
      value: |
        A merged PR normally creates this issue automatically. Use this form when no generated issue exists.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >-
        Three short sentences: the behavior to port, why it matters here, and
        what is out of scope. Detail goes in the fields below.
    validations:
      required: true
  - type: input
    id: source_pr
    attributes:
      label: machine source PR or commit
      description: Full GitHub URL.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavior to port
      description: Describe the relevant behavior and what is not relevant here.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target modules and compatibility
      description: Name the target modules and public API, platform implications, and compatibility risks.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Evidence and tests
      description: Link source validation and propose target regression tests. Mark unknowns explicitly.
    validations:
      required: true

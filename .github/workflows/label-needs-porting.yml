name: Label Needs Porting

on:
  # pull_request_target so fork PRs get a token that can write labels. It is safe here
  # because the job never checks out or runs the PR's code.
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Every PR is ported by default. The author removes the label to opt out.
      - name: Add needs porting label
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels"
          -f "labels[]=needs porting"

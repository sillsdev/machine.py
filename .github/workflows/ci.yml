name: CI build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }} using Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.17
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint with Black
        run: uv run black . --check --diff
      - name: Lint with Flake8
        run: uv run flake8 . --statistics --show-source
      - name: Lint with isort
        run: uv run isort . --check-only
      - name: Setup Node for pyright
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Lint with pyright
        run: uv run pyright
      - name: Test with pytest
        run: uv run pytest --cov --cov-report=xml
        env:
          EFLOMAL_PATH: /home/runner/work/machine.py/machine.py/.venv/lib/python${{ matrix.python-version }}/site-packages/eflomal/bin
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Create Wheel
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python 3.10
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.17
          python-version: "3.10"
      - name: Build
        run: uv build
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

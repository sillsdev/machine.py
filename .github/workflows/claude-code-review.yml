name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

env:
  PYTHON_VERSION: "3.12"

jobs:
  claude-review:
    # Secrets are not available to workflows triggered by pull requests from forked
    # repositories, so only review pull requests from branches in this repository.
    # This also keeps `poetry install` below from running build hooks authored by
    # someone without push access.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the reviewer can read git log and blame, and diff against
          # the base branch locally rather than only seeing the PR's final state.
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Restore virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: review-venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      # Gives the reviewer an interpreter to falsify its own findings with. It is not
      # here to lint or run the suite -- the CI build already does both.
      - name: Install dependencies
        run: poetry install --no-interaction --all-extras

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The built-in code-review skill, at "high" effort. The code-review plugin
          # this replaces discarded anything scoring under 80 on its confidence rubric,
          # which filtered out design and public-API findings that don't change behavior.
          prompt: '/code-review high --comment ${{ github.event.pull_request.number }}'
          # v1 has no `model` input; the model is passed through to the CLI instead.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(poetry run:*),Bash(.venv/bin/python:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options


name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

env:
  PYTHON_VERSION: "3.12"

jobs:
  claude:
    # Skips outsiders before the install; the action still checks write access. The issue or PR
    # body reaches the prompt whoever wrote it, and an outsider's fork PR would run its code.
    # Claude's own PRs are let through: the bot's association is NONE, but it wrote the body
    # and pushed the branch to this repo.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association ||
        github.event.issue.author_association) &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.issue.author_association || github.event.pull_request.author_association) ||
        (github.event.issue.user.login || github.event.pull_request.user.login) == 'claude[bot]') &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' &&
        !contains(github.event.issue.labels.*.name, 'porting') && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'porting'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so git log and blame can find the commits AGENTS.md cites.
          fetch-depth: 0
          # The persisted read-only GITHUB_TOKEN header overrides the action's app token, so
          # pushes went out as github-actions[bot] and were denied.
          persist-credentials: false

      - name: Install uv and Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.17
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # A change made from an issue is validated before its pull request is opened.
      - name: Install dependencies
        run: uv sync --locked --all-extras

      # port-pr reads the C# source from a sibling clone, as of each source PR's merge
      # commit, so it needs full history. Outside the workspace, black and flake8 skip it.
      - name: Clone sillsdev/machine
        run: git clone https://github.com/sillsdev/machine.git ../machine

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Porting issues are created with this label, so each one starts a port.
          label_trigger: porting

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # The action's own prompt ends an issue run with a "Create a PR" link; the
          # appended prompt has Claude open the pull request itself.
          claude_args: >-
            --add-dir ../machine
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git -C ../machine show:*),Bash(git -C ../machine cat-file:*),Bash(git -C ../machine log:*),Bash(git -C ../machine blame:*),Bash(uv run:*),Bash(./local_check.sh:*),Bash(tail:*),Bash(head:*)"
            --append-system-prompt "When invoked on an issue and you change code, open the pull request yourself once your commits are pushed: gh pr create --base main --head <your branch>. Post its link in your comment in place of a Create a PR link. Write the title and body with the pr-authoring skill, and put Closes #<issue number> in the body. Before opening it, run ./local_check.sh --agent-strict and commit the files black and isort rewrite. Whenever you report local_check, in a PR body or a comment, quote its last line, local_check: PASSED or local_check: FAILED (...), and never a pytest count in its place; if it did not run to that line, say it did not run. Dependencies are already installed, and you work on the branch this action created: where a skill such as port-pr says to install, create or switch branches, or push, commit on the current branch and push it the way these instructions say. Allowed commands match by prefix, so run uv run and ./local_check.sh from the repository root as they are, not after cd or inside a wrapper such as timeout. When the issue is labeled porting, port it with the port-pr skill."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action hides Claude's output, so the log does not say which calls were denied.
      # Only the command or target is printed, never file content, and @json keeps it on one
      # line so a denied command cannot issue a "::" workflow command.
      - name: Show denied tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: >-
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
          | "\(.tool_name): \((.tool_input.command? // .tool_input.file_path? // .tool_input.url?
          // .tool_input.pattern? // "") | @json | .[:300])"'
          "$EXECUTION_FILE"

      # Two Reviewable reviews that began with @claude passed the job filter, yet the action
      # found no trigger and skipped. Print what it was given, so the next miss shows why.
      - name: Show review body of a skipped mention
        if: always() && github.event_name == 'pull_request_review' && steps.claude.outputs.execution_file == ''
        continue-on-error: true
        run: jq '.review.body // "" | .[:300]' "$GITHUB_EVENT_PATH"
